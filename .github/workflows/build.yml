name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-installer
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.0.0 --yes --cleanup-tag || true
          gh release create v2.0.0 "dist/Clothing POS Setup 2.0.0.exe" --title "Clothing POS 2.0.0 (Windows installer)" --notes "Windows installer. Run it and follow the steps. Windows may show a SmartScreen warning because the app is not code-signed: More info > Run anyway."
